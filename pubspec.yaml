name: affiliate_app
description: "Afiliado — membership & assistance request app (Flutter). Built from AFILIADO (business) + PRESTADOR (architecture) Android sources."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Serialization / immutable models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.6.0

  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.3
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24

  # Localization
  intl: ^0.20.2

  # Connectivity & images
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1

  # Realtime
  socket_io_client: ^3.0.2

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.0.6
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.5

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - flavors/